common:
  envName: dev
  name: generator
replicaCount: 1
image:
  repository: gcr.io/devops-492107/generator
  pullPolicy: IfNotPresent
  tag: '11'
environment: dev
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: fraud-ksa
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
healthCheck:
  port: 8080
  requestPath: /actuator
service:
  type: NodePort
  port: 80
  targetPort: 8080
httpRoute:
  enabled: false
ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.allow-http: 'false'
    kubernetes.io/ingress.regional-static-ip-name: generator-static-ip
    kubernetes.io/ingress.class: gce-internal
  hosts:
    - host: generator.internal
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: generator-tls
      hosts:
        - generator.internal
resources:
  limits:
    cpu: 100m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 100Mi
readinessProbe:
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
volumes:
  - name: batch-volume
    emptyDir:
      sizeLimit: 1Gi
volumeMounts:
  - name: batch-volume
    mountPath: /data/batch
    readOnly: false
nodeSelector: {}
tolerations: []
affinity: {}
