common:
  envName: dev
  name: ecom-frontend
replicaCount: 5
image:
  repository: gcr.io/devops-492107/ecommerce-frontend/ecommerce-frontend
  pullPolicy: IfNotPresent
  tag: '17'
environment: dev
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: fraud-ksa
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
healthCheck:
  port: 80
  requestPath: /actuator
service:
  type: LoadBalancer
  port: 80
  targetPort: 3000
httpRoute:
  enabled: false
ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.allow-http: 'false'
    kubernetes.io/ingress.regional-static-ip-name: ecom-frontend-static-ip
    kubernetes.io/ingress.class: gce-internal
  hosts:
    - host: ecom-frontend.internal
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: ecom-frontend-tls
      hosts:
        - ecom-frontend.internal
resources:
  limits:
    cpu: 200m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 1Gi
readinessProbe: null
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
volumes:
  - name: batch-volume
    emptyDir:
      sizeLimit: 1Gi
volumeMounts:
  - name: batch-volume
    mountPath: /data/batch
    readOnly: false
nodeSelector: {}
tolerations: []
affinity: {}