global:
  enabled: true
  externalVaultAddr: "http://vault.fraud.local"

injector:
  enabled: true

  image:
    repository: hashicorp/vault-k8s
    tag: "1.7.0"

  agentImage:
    repository: hashicorp/vault
    tag: "1.21.0"

  resources:
    requests:
      memory: 128Mi
      cpu: 100m

    limits:
      memory: 256Mi
      cpu: 200m

server:
  enabled: true

  image:
    repository: hashicorp/vault
    tag: "1.21.0"

  logLevel: "debug"

  resources:
    requests:
      memory: 256Mi
      cpu: 200m

    limits:
      memory: 512Mi
      cpu: 500m

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 30
    timeoutSeconds: 5

  service:
    enabled: true
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: gce

    annotations:
      kubernetes.io/ingress.allow-http: "true"
      kubernetes.io/ingress.global-static-ip-name: vault-ip

    hosts:
      - host: vault.yourdomain.com
        paths:
          - path: /
            pathType: Prefix

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3

    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        max_lease_ttl = "90d"

        telemetry {
          disable_hostname = true
          prometheus_retention_time = "6h"
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "gcpckms" {
          project    = "devops-492107"
          region     = "global"
          key_ring   = "vault"
          crypto_key = "vault"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: standard-rwo

  serviceAccount:
    create: true

    annotations:
      iam.gke.io/gcp-service-account: vault-sa@devops-492107.iam.gserviceaccount.com

  disruptionBudget:
    enabled: true
    maxUnavailable: 1

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false