injector:
  enabled: true

  image:
    repository: hashicorp/vault-k8s
    tag: "1.7.0"

  agentImage:
    repository: hashicorp/vault
    tag: "1.21.0"

server:
  enabled: true

  image:
    repository: hashicorp/vault
    tag: "1.21.0"

  logLevel: "debug"

  service:
    enabled: true
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: gce

    annotations:
      kubernetes.io/ingress.allow-http: "true"
      kubernetes.io/ingress.global-static-ip-name: vault-ip

    hosts:
      - host: vault.fraud.local
        paths:
          - path: /
            pathType: Prefix

  ha:
    enabled: true
    replicas: 3

    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "gcpckms" {
          project    = "devops-492107"
          region     = "global"
          key_ring   = "vault"
          crypto_key = "vault"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: standard-rwo

  serviceAccount:
    create: true

    annotations:
      iam.gke.io/gcp-service-account: vault-sa@devops-492107.iam.gserviceaccount.com

  ui:
    enabled: true
    serviceType: ClusterIP